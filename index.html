<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buyer &amp; Sell — The Private Client Playbook</title>
  <meta name="description" content="A considered guide to the workflows behind exceptional real estate service. Explore fourteen practical modules and track your progress.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f3ee">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Set theme before paint to avoid a flash of the wrong scheme -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("bs-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <!-- Editorial display type paired with a crisp, modern sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/residence-hero.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Buyer &amp; Sell Playbook home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="62" height="62" rx="4" fill="#17382f"/>
          <path d="M12 29.5 32 13l20 16.5M18 27v25h28V27M27 52V37h10v15" fill="none" stroke="#f5f2e9" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
          <path d="M12 29.5 32 13l20 16.5" fill="none" stroke="#c5a46d" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
        <span class="brand-copy"><span class="brand-name">Buyer <i>&amp;</i> Sell</span><small>Private Client Playbook</small></span>
      </a>

      <div class="header-progress">
        <div class="header-progress-meta">
          <span class="progress-label" id="headerProgressLabel">0 of 14 modules complete</span>
          <span class="progress-caption">Your progress</span>
        </div>
        <div class="progress-track" id="headerProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0" aria-valuetext="0 of 14 modules complete" aria-label="Training progress">
          <div class="progress-fill" id="headerProgressFill"></div>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle color theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sidebar" aria-label="Open module menu">
          <svg class="icon-menu" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="nav-scrim" id="navScrim" hidden></div>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Training modules">
      <!-- Populated by app.js -->
    </nav>

    <main id="main" tabindex="-1">
      <!-- Dashboard and module views are rendered here by app.js -->
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-tag"><span class="footer-mark" aria-hidden="true">B<span>&amp;</span>S</span><span>Buyer &amp; Sell<small>Private Client Playbook</small></span></span>
      <span class="footer-links">
        Training resources on <a href="https://drive.google.com/drive/folders/1JD8dnZ1RQs5So590tUph-8zIykh7oxIu?usp=sharing" target="_blank" rel="noopener noreferrer">Google Drive</a> · No login required · Progress saved on this device
      </span>
    </div>
  </footer>

  <div class="sr-only" role="status" aria-live="polite" id="live"></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
